[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langgraph-rag-mcp"
version = "0.2.0"
description = "Local, source-attributed LangGraph documentation search over MCP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "filelock>=3.18,<4",
    "httpx>=0.28.1,<0.29",
    "langchain-core>=1,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "mcp>=2.2,<3",
    "numpy>=2,<3",
    "pyarrow>=19,<24",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
langgraph-rag = "langgraph_rag_mcp.cli:main"

[project.optional-dependencies]
embeddings = [
    "langchain-huggingface>=1.2.2,<2",
    "sentence-transformers>=5,<6",
    "torch>=2.6,<3",
    "transformers>=4.50,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_rag_mcp"]

[tool.uv]
exclude-newer = "2026-09-15T00:00:00Z"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py", "langgraph-mcp.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/langgraph_rag_mcp"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["transformers.*", "langchain_huggingface.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]
