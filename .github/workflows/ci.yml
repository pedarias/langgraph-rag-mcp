name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python (v7.0.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv (v10.1.0)
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv build
      - run: bash -n run-mcp-docker.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose config --quiet
      - run: docker build -t langgraph-rag-mcp:ci .
      - run: docker run --rm langgraph-rag-mcp:ci --help
      - name: Verify non-root runtime and local embedding dependencies
        run: >-
          docker run --rm --entrypoint python langgraph-rag-mcp:ci
          -c 'import os, torch; from langchain_huggingface import HuggingFaceEmbeddings;
          assert os.getuid() != 0; assert torch.version.cuda is None'
      - name: Verify packaged benchmark dataset
        run: >-
          docker run --rm --entrypoint python langgraph-rag-mcp:ci
          -c 'from langgraph_rag_mcp.evaluation import load_dataset;
          assert len(load_dataset().cases) == 20'
