services:
  langgraph-mcp:
    build: .
    environment:
      LANGGRAPH_MCP_DATA_DIR: /data
      HF_HOME: /models
    volumes:
      # Mount the vector store data to persist across container restarts
      - index-data:/data
      - model-cache:/models
    stdin_open: true
    tty: false
    # For MCP stdio communication, run the server as the main process
    # and let the host manage its lifecycle through docker compose run
    command: ["serve"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  index-data:
  model-cache:
